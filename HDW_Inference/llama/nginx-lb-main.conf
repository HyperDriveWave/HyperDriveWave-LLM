# hdw-llama-lb 的主配置 —— 只为了覆盖官方镜像默认的 `worker_processes auto`。
#
# 为什么不直接改 nginx 官方镜像的那份：镜像里那份 nginx.conf 把
# `worker_processes` 写成了 auto，在 64 核机器上会开 **64 个 worker**。
#
# 而 `least_conn` 的连接计数是**每个 worker 各算各的**（除非 upstream 里声明了
# `zone`）。64 个 worker 各自只看得到自己手上那几条连接，于是每个 worker 都
# 认为「两台后端都闲着」，把请求往同一台塞。实测症状：8 个并发请求，
# A 吃了 7 个、B 只拿到 1 个，总吞吐和单实例没区别 ——
# 负载均衡看着是配对了，实际没生效。
#
# 两个修法叠着用了：
#   1. 这里把 worker 数压到 1 —— LB 只是转发字节，一个 worker 足够，
#      而且省掉 64 份 epoll 与共享状态协调的开销；
#   2. upstream 里加 `zone`（见 nginx-lb.conf.template）——
#      即使以后有人把 worker 调大，连接计数也是跨 worker 共享的，不会再退化。
#
# 端口与上游列表**不在这个文件里**，在 nginx-lb.conf.template 里，
# 由官方镜像的 entrypoint 用 envsubst 渲染。

worker_processes 1;

error_log /var/log/nginx/error.log warn;
pid       /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    access_log /var/log/nginx/access.log;

    sendfile      on;
    tcp_nopush    on;
    keepalive_timeout 65;

    # server / upstream 定义由下面的 conf.d 提供（模板渲染产物）。
    include /etc/nginx/conf.d/*.conf;
}
