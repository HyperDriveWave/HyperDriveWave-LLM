# vendored 第三方依赖清单 —— 由 Scripts/fetch_vendors.sh 消费。
#
# 这些仓库**不进版本库**（见 .gitignore）。仓库里只留这份锁文件，
# 部署时按下面的 URL 和 commit 克隆回原路径，项目结构保持不变。
#
# 格式（制表符分隔，空行和 # 开头的行忽略）：
#   <相对路径> <TAB> <commit> <TAB> <默认拉取> <TAB> <分支> <TAB> <URL，逗号分隔按序尝试>
#
# default 列：
#   yes = 默认部署需要，fetch_vendors.sh 直接拉
#   no  = 预留未启用（当前 compose 无服务、代码无引用），用 --all / --with 才拉
#
# URL 列：**规范上游在前，镜像兜底在后**。多数现有 remote 是 gitee 镜像或
# 个人 fork，存续性没有保证；因为锚定的是 commit（SHA 不可变），换 URL
# 不影响可复现性，所以优先写规范上游。
#
# 升级某个依赖的步骤：
#   1. cd <路径> && git fetch && git log --oneline origin/<分支> | head
#   2. 挑好 commit，把它填到本文件第 2 列
#   3. bash Scripts/fetch_vendors.sh --with <名字>   重新检出
#   4. bash Scripts/deploy_verify.sh                 确认没坏

# ── 默认部署需要 ───────────────────────────────────────────────
# llama.cpp：本地推理引擎的源码。**版本库里没有它的源码，也没有编译好的二进制**
# （源码树 1.4G、CUDA 产物 974M），所以从 GitHub 克隆的项目必须先跑
# Scripts/build_llama.sh 现场编译，否则部署会死在「找不到 llama-server」。
#
# 镜像兜底：github 在国内不一定连得上（实测会**无限挂起**），所以带了 gitee 镜像。
# **注意 URL 后面的 #<commit>** —— 镜像没有我们锁定的那个 commit（它是定时同步的，
# 天然落后几天），不带 # 的话每一级回退都会失败。这里锁的镜像版本是
# 2026-08-28，比上游锁定的 2026-09-08 落后 11 天。
#
# 已验证该镜像**保留了 MTP 投机解码**（common/arg.cpp 的 spec_type_draft_mtp、
# opts.download_mtp、--spec-type 与本机那份逐处一致），这是本项目最依赖的特性。
# 但版本毕竟不同，走到镜像兜底后 fetch_vendors.sh 会警告并要求重跑验收。
#
# 其他确认不存在的镜像（别再试了）：gitee.com/mirrors/llama.cpp（点号，不存在）、
# gitee.com/ggml-org/llama.cpp（不存在）、gitee.com/lure_ai/llama.cpp（存在但停在
# 2026-04-20，落后 5 个月，太旧）。连 github 和 gitee 都不通的机器请改用离线包——
# pack_hdw.sh 打出来的包里带着源码和产物。
HDW_Inference/llama/llama.cpp-upstream	f3f1a8f2760f28325a5ec20c05b171e5b7c83a29	yes	master	https://github.com/ggml-org/llama.cpp,https://gitee.com/mirrors/llama-cpp#b387ddfd84b4b1f79a6e09910748195e3320e89e

