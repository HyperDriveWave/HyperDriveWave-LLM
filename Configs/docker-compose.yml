name: hyperdrivewave

# ── llama.cpp 实例的公共参数 ─────────────────────────────────────
# hdw-llama 与 hdw-llama-2 共用这一份，**刻意不做成两份拷贝**：负载均衡的两个
# 后端一旦配置漂移，症状是「同一个问题问两次表现不一样」——排查时会一路怀疑到
# 网络、缓存、采样、模型量化，极难定位到配置上去。
#
# 端口不在这里，也不由 .env 决定：两份实例各自在自己的网络命名空间里都监听
# 1919，靠 compose 的端口映射区分（宿主上的 1921 / 1920）。这样"实例 A/B"的
# 定义里除了显卡编号没有任何差别。
#
# 写成字符串而不是列表：compose 会对字符串做分词，${HDW_LLAMA_EXTRA_ARGS}
# 展开成的 `--spec-type draft-mtp` 才会被拆成两个参数。写成 YAML 列表的话
# 它就成了**一个**带空格的参数，llama-server 会直接报未知选项。
#
# 多模态：Qwen3.8-27B 本身是原生视觉语言模型，但**视觉那部分不在语言模型的
# GGUF 里**，而是单独一个 mmproj 文件（视觉投影器）。没有它，上传的图片对
# 模型就是乱码 token。要关掉多模态就把 HDW_LLAMA_MMPROJ_ARGS 置空 ——
# 两个参数必须一起给或者一起不给（--mmproj-offload 没有 --mmproj 会直接报错）。
# mmproj 与语言模型来自同一个魔搭仓库 ISTA-DASLab/Qwen3.8-27B-GSQ-RCO-GGUF。
x-hdw-llama-args: &hdw-llama-args >-
  --model /models/LLM_Models/Qwen3.8-27B-GSQ/Qwen3.8-27B-GSQ-RCO-IQ3_S-mtp.gguf
  --host 0.0.0.0
  --port 1919
  --device CUDA0
  --ctx-size ${HDW_LLAMA_CTX:-262144}
  --gpu-layers all
  --timeout ${HDW_LLAMA_TIMEOUT:-3600}
  --cache-type-k ${HDW_LLAMA_CACHE_TYPE_K:-q4_0}
  --cache-type-v ${HDW_LLAMA_CACHE_TYPE_V:-q4_0}
  --flash-attn auto
  ${HDW_LLAMA_MMPROJ_ARGS:---mmproj /models/LLM_Models/Qwen3.8-27B-GSQ/mmproj-Qwen3.8-27B-BF16.gguf --mmproj-offload}
  ${HDW_LLAMA_EXTRA_ARGS:---spec-type draft-mtp}

services:
  hdw-postgres:
    # 机器重启/Docker 重启后自动拉起。**远端 compose 一直有这条，本机漏了**——2026-09-26 内核升级重启后，本机 10 个容器一个都没回来。
    restart: unless-stopped
    image: postgres:17
    profiles: ["base"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hdw}
      POSTGRES_USER: ${POSTGRES_USER:-hdw}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    volumes:
      - ${HDW_RUNTIME_ROOT:-../HDW_Runtime}/postgres:/var/lib/postgresql/data
      - ../HDW_DataFoundation/RelationalDB/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${HDW_POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  hdw-redis:
    # 机器重启/Docker 重启后自动拉起。**远端 compose 一直有这条，本机漏了**——2026-09-26 内核升级重启后，本机 10 个容器一个都没回来。
    restart: unless-stopped
    image: redis:7
    profiles: ["base"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-change_me}
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-change_me}"]
    volumes:
      - ${HDW_RUNTIME_ROOT:-../HDW_Runtime}/redis:/data
    ports:
      - "127.0.0.1:${HDW_REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD:-change_me}\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10

  hdw-neo4j:
    # 机器重启/Docker 重启后自动拉起。**远端 compose 一直有这条，本机漏了**——2026-09-26 内核升级重启后，本机 10 个容器一个都没回来。
    restart: unless-stopped
    image: neo4j:5
    profiles: ["base"]
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH:-neo4j/change_me}
    volumes:
      - ${HDW_RUNTIME_ROOT:-../HDW_Runtime}/neo4j/data:/data
      - ${HDW_RUNTIME_ROOT:-../HDW_Runtime}/neo4j/logs:/logs
      - ../HDW_KnowledgeGraph/cypher:/cypher:ro
    ports:
      - "127.0.0.1:${HDW_NEO4J_HTTP_PORT:-7474}:7474"
      - "127.0.0.1:${HDW_NEO4J_BOLT_PORT:-7687}:7687"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20

  hdw-llm:
    # 机器重启/Docker 重启后自动拉起。**远端 compose 一直有这条，本机漏了**——2026-09-26 内核升级重启后，本机 10 个容器一个都没回来。
    restart: unless-stopped
    build:
      context: ../HDW_Inference/FreeToken
      args:
        # 构建期 pip 源。docker build 不读宿主机的 pip.conf，只能这样注入。
        # 改 Configs/.env 里的 PIP_INDEX_URL 即可切换；要回官方源填 https://pypi.org/simple
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://mirrors.aliyun.com/pypi/simple/}
    profiles: ["legacy-freetoken"]
    gpus: all
    environment:
      PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
    volumes:
      - ../HDW_Engines:/models:ro
    ports:
      - "127.0.0.1:${HDW_LLM_PORT:-8000}:1919"
    command: >
      ft serve
      --model /models/LLM_Models/Qwen3.8-27B-FP8
      --served-model-name qwen3.8-27b
      --host 0.0.0.0
      --port 1919
      --gpu ${HDW_LLM_GPU:-0}
      --max-running-requests ${HDW_LLM_MAX_RUNNING_REQUESTS:-4}
      --memory-ratio ${HDW_LLM_MEMORY_RATIO:-0.9}
      --max-seq-len-override ${HDW_LOCAL_MAX_SEQ_LEN:-262144}
      --max-output-tokens ${HDW_LOCAL_MAX_OUTPUT_TOKENS:-8192}
      --max-prefill-length ${HDW_LLM_MAX_PREFILL_LENGTH:-512}
      --reasoning-parser ${HDW_LOCAL_REASONING_PARSER:-qwen3}
      --sampling-defaults model

  hdw-llama:
    # **容器化的 llama.cpp** —— 给「宿主跑不了预编译二进制」的机器用。
    #
    # HDW_Inference/llama/start.sh 走的是 build-cuda-multi/ 里的预编译二进制，
    # 那是在新版发行版上编的，依赖 GLIBC_2.43 / GLIBCXX_3.4.32 / libssl.so.3。
    # 麒麟 V10、RHEL8 这类机器只有 glibc 2.28 + OpenSSL 1.1.1，**补 .so 也没用**
    # （glibc 是 C 库本体，不能外挂）。实测在麒麟 V10 上：
    #   `error while loading shared libraries: libssl.so.3` → 退出码 127。
    # 更坑的是 start.sh 里 `--spec-type` 的探测会拿一个跑不起来的二进制去问
    # --help，于是**误报「不支持 MTP」**，把人的注意力引到 MTP 上。
    #
    # 容器自带新版 glibc，把这一整类问题挡在外面；源码在容器里按目标卡的算力
    # 重编一次即可，不需要宿主装 CUDA toolkit。
    #
    # 默认**不启用**：宿主能直接跑时仍走 systemd 的
    # hyperdrivewave-llama.service，少一层容器、也少 11 GB 镜像。
    # 要启用：把 llama-container 加进 HDW_COMPOSE_PROFILES，
    # 并**先停掉宿主那个 llama 服务**，否则两边抢同一个端口。
    restart: unless-stopped
    image: hyperdrivewave-hdw-llama:latest
    build:
      context: ../HDW_Inference/llama
      dockerfile: Dockerfile.container
      args:
        # 目标卡的算力：L20 = 89，A100 = 80，H100 = 90，RTX 5090 = 120。
        # 混合部署写成 "80;89"（分号分隔，CMake 的语法）。
        # 编错了不会报错，只会**一路回落到 CPU**（约 1 token/s），所以别猜。
        CUDA_ARCH: ${HDW_LLAMA_CUDA_ARCH:-89}
    profiles: ["llama-container"]
    # **刻意不用 host 网络。** 端口映射到宿主**回环**（127.0.0.1:1921），
    # 只有负载均衡器对外监听 0.0.0.0:1919。
    # 之前 llama 直接绑 0.0.0.0:1919，整个局域网都能打它 —— 而这个端口
    # **没有任何鉴权**。收敛成「只有 LB 可达」是顺带的收益。
    # qa-api 走的 host.docker.internal:1919 照样通，那正是 LB。
    ports:
      - "127.0.0.1:${HDW_LLAMA_A_PORT:-1921}:1919"
    # 只挂一张卡 —— 共享机器上别把 4 张全占了。
    #
    # **必须走 deploy.resources 这一套，不能只设 NVIDIA_VISIBLE_DEVICES。**
    # 后者只是给 nvidia runtime 读的变量；容器如果没选 nvidia runtime，驱动
    # 根本不会被注入，表现是
    #     error while loading shared libraries: libcuda.so.1
    # 而且容器会一直 Restarting —— 不 docker logs 就看不出是这个原因。
    # （2026-10-01 实测踩到。）
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${HDW_LLAMA_GPU:-0}"]
              capabilities: [gpu]
    volumes:
      - ../HDW_Engines:/models:ro
    # 参数在文件顶部的 x-hdw-llama-args 锚点里，与 hdw-llama-2 同源。
    command: *hdw-llama-args

  hdw-llama-2:
    # 第二份 llama.cpp 实例 —— 用来**提高并发**，不是提高单路速度。
    #
    # 实测一台 L20：单路 80.9 t/s；4 路并发时总吞吐 145 t/s，但每人只剩 44.3。
    # 加一份实例后，同样的 4 个人变成每人 63.0 t/s（+42%），可并发数 4 → 8。
    # **单路速度不变**（两边都是 80.9）——想要单路更快得走 --split-mode，
    # 那是另一回事。
    #
    # 默认不启用：只有一张卡时它起不来。要启用三件事一起做：
    #   1) HDW_LLAMA_GPU_2 指到另一张卡
    #   2) 把 llama-scale 加进 HDW_COMPOSE_PROFILES
    #   3) 确保 hdw-llama-lb 在跑（它属于 llama-container），
    #      否则 1919 上没有任何东西在听
    restart: unless-stopped
    image: hyperdrivewave-hdw-llama:latest
    profiles: ["llama-scale"]
    ports:
      - "127.0.0.1:${HDW_LLAMA_B_PORT:-1920}:1919"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${HDW_LLAMA_GPU_2:-1}"]
              capabilities: [gpu]
    volumes:
      - ../HDW_Engines:/models:ro
    command: *hdw-llama-args

  hdw-llama-lb:
    # 两份 llama 实例前面的负载均衡，监听客户端真正连的那个端口。
    #
    # 有了它，qa-api / start.sh / deploy_verify.sh **一行都不用改**：它们连的
    # 还是 host.docker.internal:1919（或 127.0.0.1:1919），感知不到后面有一份
    # 还是两份实例。
    #
    # host 网络：上游是宿主回环上的两个端口，用 host 网络最直接；也顺带避开
    # 「上游容器不存在时 nginx 因解析不到域名而**起不来**」这个问题 ——
    # 上游写成静态的 127.0.0.1:port，nginx 启动时不需要解析任何名字，
    # 第二份实例没开也只是那台上游不可用，由 max_fails 摘掉。
    #
    # 端口与上游列表通过模板 envsubst 注入，
    # 见 HDW_Inference/llama/nginx-lb.conf.template。
    restart: unless-stopped
    image: nginx:1.27-alpine
    profiles: ["llama-container"]
    network_mode: host
    environment:
      HDW_LLAMA_A_PORT: ${HDW_LLAMA_A_PORT:-1921}
      HDW_LLAMA_B_PORT: ${HDW_LLAMA_B_PORT:-1920}
      HDW_LLAMA_LB_PORT: ${HDW_LLAMA_PORT:-1919}
      # 只替换这几个键。不设的话 envsubst 会去动 $host / $remote_addr 这类
      # nginx 自己的变量 —— envsubst 分不清「环境变量」和「nginx 变量」，
      # 它只是把环境里出现的名字全替换掉。
      NGINX_ENVSUBST_FILTER: "^HDW_LLAMA_"
    volumes:
      - ../HDW_Inference/llama/nginx-lb.conf.template:/etc/nginx/templates/default.conf.template:ro
      # 覆盖镜像自带的 worker_processes auto。**必须单 worker**，原因见该文件注释
      # —— 多 worker 时 least_conn 的计数不共享，负载均衡会静默失效。
      - ../HDW_Inference/llama/nginx-lb-main.conf:/etc/nginx/nginx.conf:ro

  hdw-rag:
    # 机器重启/Docker 重启后自动拉起。**远端 compose 一直有这条，本机漏了**——2026-09-26 内核升级重启后，本机 10 个容器一个都没回来。
    restart: unless-stopped
    build:
      context: ../HDW_Inference/RAG_Service
      args:
        # 构建期 pip 源。docker build 不读宿主机的 pip.conf，只能这样注入。
        # 改 Configs/.env 里的 PIP_INDEX_URL 即可切换；要回官方源填 https://pypi.org/simple
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://mirrors.aliyun.com/pypi/simple/}
    profiles: ["base"]
    environment:
      # 容器默认没有 TZ，裸的 date.today() / now() 走 UTC —— 北京时间 0:00-8:00
      # 这段时间里它们拿到的是**前一天**。实测：宿主 10-01 07:35，容器以为是 09-30 23:35，
      # 于是「抓今天的日志」抓回来的是昨天的。.astimezone() 同理，会把 UTC 当本地时间报出去。
      # 注意：显式写 timezone.utc 的地方不受影响（那些是 aware datetime）。
      TZ: ${HDW_TZ:-Asia/Shanghai}
      HDW_BGE_M3_PATH: /models/RAG_Models/bge-m3
      HDW_RERANKER_PATH: /models/RAG_Models/bge-reranker-v2-m3
      HDW_RAG_INDEX_PATH: /data/rag/chunks.jsonl
      HDW_ZVEC_COLLECTION_PATH: /data/zvec/industrial_chunks
      HDW_RAG_DEVICE: ${HDW_RAG_DEVICE:-cpu}
      HDW_EMBED_MAX_LENGTH: ${HDW_EMBED_MAX_LENGTH:-1024}
      HDW_RERANK_MAX_LENGTH: ${HDW_RERANK_MAX_LENGTH:-512}
      HDW_RERANK_CANDIDATES: ${HDW_RERANK_CANDIDATES:-50}
    volumes:
      - ../HDW_Engines:/models:ro
      - ${HDW_RUNTIME_ROOT:-../HDW_Runtime}/rag:/data/rag:ro
      - ${HDW_RUNTIME_ROOT:-../HDW_Runtime}/zvec:/data/zvec
    ports:
      - "127.0.0.1:${HDW_RAG_PORT:-8001}:8001"

  hdw-mineru:
    # 机器重启/Docker 重启后自动拉起。**远端 compose 一直有这条，本机漏了**——2026-09-26 内核升级重启后，本机 10 个容器一个都没回来。
    restart: unless-stopped
    image: hyperdrivewave-hdw-mineru:latest
    build:
      context: ../HDW_Knowledge/MinerU
      dockerfile: docker/hyperdrivewave-pipeline.Dockerfile
      args:
        # 构建期 pip 源。docker build 不读宿主机的 pip.conf，只能这样注入。
        # 改 Configs/.env 里的 PIP_INDEX_URL 即可切换；要回官方源填 https://pypi.org/simple
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://mirrors.aliyun.com/pypi/simple/}
    # 同时挂在 base 和 knowledge 下。
    #
    # 原本只有 knowledge，但 hdw-ingest（在 base 里）depends_on 它 ——
    # compose 只解析**被启用 profile** 里的服务，于是 `--profile base` 会直接报
    #     service "hdw-ingest" depends on undefined service "hdw-mineru"
    # 整个项目起不来。也就是说 knowledge 这个"门"从来就关不上：想用 ingest
    # 就必须连带 knowledge，而默认配置恰好三个 profile 全开，所以一直没暴露。
    # 拆出 knowledge 本意是让不想装 MinerU（16.7 GB）的人也能跑问答，
    # 但 ingest 就是知识入库的入口，两者拆不开——挂两个 profile 既恢复了
    # `--profile base` 单独可用，也不影响原有 `base knowledge web` 的写法。
    profiles: ["base", "knowledge"]
    environment:
      MINERU_MODEL_SOURCE: local
      MINERU_API_OUTPUT_ROOT: /data/api_output
      MINERU_API_MAX_CONCURRENT_REQUESTS: 1
    volumes:
      - ${HDW_RUNTIME_ROOT:-../HDW_Runtime}/mineru:/data
    ports:
      - "127.0.0.1:${HDW_MINERU_PORT:-8002}:8002"
    command: ["mineru-api", "--host", "0.0.0.0", "--port", "8002"]

  hdw-qa-api:
    # 机器重启/Docker 重启后自动拉起。**远端 compose 一直有这条，本机漏了**——2026-09-26 内核升级重启后，本机 10 个容器一个都没回来。
    restart: unless-stopped
    build:
      context: ../HDW_Orchestrator/industrial-qa-api
      args:
        # 构建期 pip 源。docker build 不读宿主机的 pip.conf，只能这样注入。
        # 改 Configs/.env 里的 PIP_INDEX_URL 即可切换；要回官方源填 https://pypi.org/simple
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://mirrors.aliyun.com/pypi/simple/}
    profiles: ["base"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # 容器默认没有 TZ，裸的 date.today() / now() 走 UTC —— 北京时间 0:00-8:00
      # 这段时间里它们拿到的是**前一天**。实测：宿主 10-01 07:35，容器以为是 09-30 23:35，
      # 于是「抓今天的日志」抓回来的是昨天的。.astimezone() 同理，会把 UTC 当本地时间报出去。
      # 注意：显式写 timezone.utc 的地方不受影响（那些是 aware datetime）。
      TZ: ${HDW_TZ:-Asia/Shanghai}
      DATABASE_URL: ${DATABASE_URL:-postgresql://hdw:change_me@hdw-postgres:5432/hdw}
      NEO4J_URI: bolt://hdw-neo4j:7687
      HDW_NEO4J_HTTP_URL: http://hdw-neo4j:7474/db/neo4j/tx/commit
      NEO4J_AUTH: ${NEO4J_AUTH:-neo4j/change_me}
      HDW_LLM_BASE_URL: ${HDW_LOCAL_LLM_BASE_URL:-http://host.docker.internal:1919/v1}
      HDW_LOCAL_LLM_BASE_URL: ${HDW_LOCAL_LLM_BASE_URL:-http://host.docker.internal:1919/v1}
      HDW_LOCAL_LLM_MODEL: ${HDW_LOCAL_LLM_MODEL:-Qwen3.8-27B-GSQ-RCO-IQ3_S-mtp.gguf}
      HDW_LLM_MODE: ${HDW_LLM_MODE:-offline}
      HDW_ONLINE_LLM_BASE_URL: ${HDW_ONLINE_LLM_BASE_URL:-https://api.deepseek.com}
      HDW_ONLINE_LLM_MODEL: ${HDW_ONLINE_LLM_MODEL:-deepseek-flash}
      HDW_ONLINE_LLM_API_KEY: ${HDW_ONLINE_LLM_API_KEY:-}
      HDW_LLM_MAX_TOKENS: ${HDW_LLM_MAX_TOKENS:-8192}
      HDW_ONLINE_GRAPH_TOP_K: ${HDW_ONLINE_GRAPH_TOP_K:-40}
      HDW_LOCAL_GRAPH_TOP_K: ${HDW_LOCAL_GRAPH_TOP_K:-10}
      HDW_LLM_TIMEOUT: ${HDW_LLM_TIMEOUT:-120}
      HDW_CONTEXT_WINDOW_TOKENS: ${HDW_CONTEXT_WINDOW_TOKENS:-1000000}
      HDW_LOCAL_CONTEXT_WINDOW_TOKENS: ${HDW_LOCAL_CONTEXT_WINDOW_TOKENS:-262144}
      HDW_CONTEXT_COMPRESSION_THRESHOLD: ${HDW_CONTEXT_COMPRESSION_THRESHOLD:-0.75}
      HDW_CONTEXT_COMPRESSION_TARGET: ${HDW_CONTEXT_COMPRESSION_TARGET:-0.55}
      HDW_CONTEXT_COMPRESSION_MAX_TOKENS: ${HDW_CONTEXT_COMPRESSION_MAX_TOKENS:-2000}
      HDW_RAG_BASE_URL: http://hdw-rag:8001
      HDW_RAG_REMOTE_URLS: ${HDW_RAG_REMOTE_URLS:-}
      HDW_RAG_TIMEOUT: ${HDW_RAG_TIMEOUT:-60}
      HDW_RAG_CONNECT_TIMEOUT: ${HDW_RAG_CONNECT_TIMEOUT:-3}
      HDW_RAG_HEALTH_TIMEOUT: ${HDW_RAG_HEALTH_TIMEOUT:-5}
      HDW_MCP_BASE_URL: http://hdw-mcp:8766/mcp
      # 检索路由与实时测点（见 README §7.4/§7.5）。这几项不影响默认行为，
      # 但必须在 environment 里显式透传，否则 .env 里怎么改都进不了容器。
      HDW_RETRIEVAL_ROUTER: ${HDW_RETRIEVAL_ROUTER:-true}
      HDW_LIVE_POINTS_MAX: ${HDW_LIVE_POINTS_MAX:-3}
      HDW_LIVE_POINT_CANDIDATES: ${HDW_LIVE_POINT_CANDIDATES:-5}
      HDW_LIVE_TIME_OFFSET_HOURS: ${HDW_LIVE_TIME_OFFSET_HOURS:-8}
      HDW_MODEL_CONFIG_PATH: /data/model-config/config.json
      HDW_MINERU_BASE_URL: http://hdw-mineru:8002
      # 图片转写走 MinerU 时的超时与队列上限。**必须在 environment 里显式透传**，
      # 否则 .env 里怎么改都进不了容器（同 167-172 行那批）。
      # 与摄取侧刻意不同：ETL 不设超时（批处理没人等），问答路径有用户等。
      HDW_MINERU_TIMEOUT: ${HDW_MINERU_TIMEOUT:-180}
      HDW_VISION_MINERU_MAX_QUEUE: ${HDW_VISION_MINERU_MAX_QUEUE:-1}
      HDW_MINERU_BACKEND: ${HDW_MINERU_BACKEND:-pipeline}
      HDW_MINERU_LANG: ${HDW_MINERU_LANG:-ch}
      HDW_FRP_PUBLIC_HOST: ${HDW_FRP_PUBLIC_HOST:-}
      HDW_LLM_PRESENCE_PENALTY: ${HDW_LLM_PRESENCE_PENALTY:-0.3}
      HDW_INTERNAL_API_KEY: ${HDW_INTERNAL_API_KEY:-local-dev-key}
      # 服务间入口 /internal/qa/query 用的密钥。**必须与 hdw-api 那个服务里
      # 同名变量的值一致**——两侧不一致时调用方只会拿到一个 502，看不出原因，
      # 所以 deploy_verify.sh 里专门有一条检查在挑这个。留空则该接口不开放。
      HDW_API_INTERNAL_KEY: ${HDW_API_INTERNAL_KEY:-}
      HDW_ENABLE_AUTH: ${HDW_ENABLE_AUTH:-false}
      HDW_MAINTENANCE_SOCKET: /run/hdw-maintenance/maintenance.sock
      HDW_MAINTENANCE_TIMEOUT: ${HDW_MAINTENANCE_TIMEOUT:-0}
      HDW_CHATDATA_ROOT: /data/chatdata
      HDW_AUTH_CSV_PATH: /app/auth.csv
      HDW_AUTH_SECRET: ${HDW_AUTH_SECRET:-change_me}
      LANGFUSE_HOST: ${LANGFUSE_HOST:-}
    volumes:
      - ../HDW_Engines/LLM_API:/app/LLM_API:ro
      - ../HDW_Security/auth/auth.py:/app/hdw_auth.py:ro
      - ../HDW_Security/auth/auth.csv:/app/auth.csv:ro
      - ${HDW_RUNTIME_ROOT:-../HDW_Runtime}/zvec:/data/zvec
      - ${HDW_RUNTIME_ROOT:-../HDW_Runtime}/mineru:/data/mineru
      - ${HDW_RUNTIME_ROOT:-../HDW_Runtime}/chatdata:/data/chatdata
      - ${HDW_RUNTIME_ROOT:-../HDW_Runtime}/model-config:/data/model-config
      - ${HDW_RUNTIME_ROOT:-../HDW_Runtime}/maintenance:/run/hdw-maintenance
    ports:
      - "${HDW_QA_API_PORT:-8080}:8080"
    depends_on:
      hdw-postgres:
        condition: service_healthy
      hdw-redis:
        condition: service_healthy
      hdw-neo4j:
        condition: service_healthy
      hdw-rag:
        condition: service_started
      hdw-mcp:
        condition: service_started

  hdw-ingest:
    # 机器重启/Docker 重启后自动拉起。**远端 compose 一直有这条，本机漏了**——2026-09-26 内核升级重启后，本机 10 个容器一个都没回来。
    restart: unless-stopped
    build:
      context: ../HDW_Orchestrator/industrial-ingest-api
      args:
        # 构建期 pip 源。docker build 不读宿主机的 pip.conf，只能这样注入。
        # 改 Configs/.env 里的 PIP_INDEX_URL 即可切换；要回官方源填 https://pypi.org/simple
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://mirrors.aliyun.com/pypi/simple/}
    profiles: ["base"]
    environment:
      # 容器默认没有 TZ，裸的 date.today() / now() 走 UTC —— 北京时间 0:00-8:00
      # 这段时间里它们拿到的是**前一天**。实测：宿主 10-01 07:35，容器以为是 09-30 23:35，
      # 于是「抓今天的日志」抓回来的是昨天的。.astimezone() 同理，会把 UTC 当本地时间报出去。
      # 注意：显式写 timezone.utc 的地方不受影响（那些是 aware datetime）。
      TZ: ${HDW_TZ:-Asia/Shanghai}
      HDW_KNOWLEDGE_SOURCE_ROOT: /data/knowledge_sources
      HDW_MINERU_PARSED_ROOT: /data/mineru/parsed
      HDW_RAG_INDEX_PATH: /data/rag/chunks.jsonl
      HDW_ZVEC_COLLECTION_PATH: /data/zvec/industrial_chunks
      HDW_INGEST_STATE_PATH: /data/ingest/state.json
      HDW_PIPELINES_ROOT: /pipelines
      HDW_MINERU_BASE_URL: http://hdw-mineru:8002
      HDW_RAG_BASE_URL: http://hdw-rag:8001
      HDW_NEO4J_HTTP_URL: http://hdw-neo4j:7474/db/neo4j/tx/commit
      NEO4J_AUTH: ${NEO4J_AUTH:-neo4j/change_me}
      HDW_RAG_REMOTE_URLS: ${HDW_RAG_REMOTE_URLS:-}
      HDW_RAG_ADMIN_TOKEN: ${HDW_RAG_ADMIN_TOKEN:-}
      HDW_REMOTE_RAG_SYNC_TIMEOUT: ${HDW_REMOTE_RAG_SYNC_TIMEOUT:-0}
      HDW_MAINTENANCE_SOCKET: /run/hdw-maintenance/maintenance.sock
      HDW_MAINTENANCE_TIMEOUT: ${HDW_MAINTENANCE_TIMEOUT:-0}
      HDW_ENTITY_ALIASES_PATH: /app/entity_aliases.json
      HDW_GRAPH_REVIEW_PATH: /data/ingest/entities_review.jsonl
      HDW_AUTH_CSV_PATH: /app/auth.csv
      HDW_AUTH_SECRET: ${HDW_AUTH_SECRET:-change_me}
    volumes:
      - ${HDW_RUNTIME_ROOT:-../HDW_Runtime}/knowledge_sources:/data/knowledge_sources
      - ${HDW_RUNTIME_ROOT:-../HDW_Runtime}/mineru:/data/mineru
      - ${HDW_RUNTIME_ROOT:-../HDW_Runtime}/rag:/data/rag
      - ${HDW_RUNTIME_ROOT:-../HDW_Runtime}/zvec:/data/zvec:ro
      - ${HDW_RUNTIME_ROOT:-../HDW_Runtime}/ingest:/data/ingest
      - ${HDW_RUNTIME_ROOT:-../HDW_Runtime}/maintenance:/run/hdw-maintenance
      - ../HDW_DataFoundation/ETL_Pipelines:/pipelines:ro
      - ../HDW_KnowledgeGraph/entity_aliases.json:/app/entity_aliases.json:ro
      - ../HDW_Security/auth/auth.py:/app/hdw_auth.py:ro
      - ../HDW_Security/auth/auth.csv:/app/auth.csv:ro
    ports:
      - "127.0.0.1:${HDW_INGEST_PORT:-8090}:8090"
    depends_on:
      hdw-mineru:
        condition: service_started
      hdw-rag:
        condition: service_started
      hdw-neo4j:
        condition: service_healthy

  hdw-api:
    # 机器重启/Docker 重启后自动拉起。**远端 compose 一直有这条，本机漏了**——2026-09-26 内核升级重启后，本机 10 个容器一个都没回来。
    restart: unless-stopped
    build:
      context: ../HDW_API
      args:
        # 构建期 pip 源。docker build 不读宿主机的 pip.conf，只能这样注入。
        # 改 Configs/.env 里的 PIP_INDEX_URL 即可切换；要回官方源填 https://pypi.org/simple
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://mirrors.aliyun.com/pypi/simple/}
    profiles: ["base"]
    environment:
      # 容器默认没有 TZ，裸的 date.today() / now() 走 UTC —— 北京时间 0:00-8:00
      # 这段时间里它们拿到的是**前一天**。实测：宿主 10-01 07:35，容器以为是 09-30 23:35，
      # 于是「抓今天的日志」抓回来的是昨天的。.astimezone() 同理，会把 UTC 当本地时间报出去。
      # 注意：显式写 timezone.utc 的地方不受影响（那些是 aware datetime）。
      TZ: ${HDW_TZ:-Asia/Shanghai}
      # 本服务自己不做问答，转发给 qa-api 的服务间入口。
      # 走服务名 + 容器内端口，与宿主映射无关（改 HDW_QA_API_PORT 不影响这里）。
      HDW_QA_API_URL: http://hdw-qa-api:8080
      # 密钥分工不同：调用方密钥（HDW_API_KEYS / HDW_API_KEY）给别的项目，
      # HDW_API_INTERNAL_KEY 只有本容器和 qa-api 知道。**必须在 environment 里
      # 显式透传**，compose 没有 env_file，漏写就是容器里读不到（同 167-177 行那批）。
      # 调用方密钥。HDW_API_KEYS 是列表（标签:密钥,标签:密钥），配了它以它为准；
      # HDW_API_KEY 是单密钥形式，只有没配列表时才用。两个都透传。
      HDW_API_KEYS: ${HDW_API_KEYS:-}
      HDW_API_KEY: ${HDW_API_KEY:-}
      HDW_API_INTERNAL_KEY: ${HDW_API_INTERNAL_KEY:-}
      HDW_API_QA_TIMEOUT: ${HDW_API_QA_TIMEOUT:-600}
      HDW_CHATDATA_ROOT: /data/chatdata
    volumes:
      # 只挂 chatdata：留档写这里，其余一概不碰。
      - ${HDW_RUNTIME_ROOT:-../HDW_Runtime}/chatdata:/data/chatdata
    ports:
      # 绑所有网卡（与 qa-api 同款 `any`）。内网直连，暂不经 FRP。
      # 这个端口是给**别的项目**调用的，靠 HDW_API_KEY 保护——
      # 密钥没配时接口直接拒绝服务，不会敞开（见 app.py 的 _require_caller）。
      - "${HDW_API_PORT:-8095}:8095"
    depends_on:
      hdw-qa-api:
        condition: service_started

  hdw-mcp:
    # 机器重启/Docker 重启后自动拉起。**远端 compose 一直有这条，本机漏了**——2026-09-26 内核升级重启后，本机 10 个容器一个都没回来。
    restart: unless-stopped
    build:
      context: ../HDW_DataFoundation/MCP
      dockerfile: Dockerfile
      args:
        # 构建期 pip 源。docker build 不读宿主机的 pip.conf，只能这样注入。
        # 改 Configs/.env 里的 PIP_INDEX_URL 即可切换；要回官方源填 https://pypi.org/simple
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://mirrors.aliyun.com/pypi/simple/}
    profiles: ["base"]
    environment:
      # 容器默认没有 TZ，裸的 date.today() / now() 走 UTC —— 北京时间 0:00-8:00
      # 这段时间里它们拿到的是**前一天**。实测：宿主 10-01 07:35，容器以为是 09-30 23:35，
      # 于是「抓今天的日志」抓回来的是昨天的。.astimezone() 同理，会把 UTC 当本地时间报出去。
      # 注意：显式写 timezone.utc 的地方不受影响（那些是 aware datetime）。
      TZ: ${HDW_TZ:-Asia/Shanghai}
      HDW_MCP_BIND: 0.0.0.0
      HDW_MCP_PORT: 8766
      HDW_MCP_MAPPING_ROOT: /data/mapping
      HDW_MCP_THERMAL_ROOT: /data/thermal
      HDW_MCP_LSTM_ROOT: /data/lstm
      # LIEMS 日志抓取模块。载体放在**已挂载**的 Mapping 目录下，
      # 因此不需要新增挂载点。模块从自身目录读 config.json
      # （可用 HDW_LOG_FETCHING_CONFIG 覆盖），凭据在部署时从 Configs/.env 生成。
      # 该目录已被 .gitignore 排除，凭据不会进版本库。
      HDW_MCP_LOG_ROOT: /data/mapping/Log_Fetching
      # 抓取过程的临时目录。注意本模块设计为**不保留**日志数据：
      # 每次 fetch_range 结束都会 cleanup 掉导出文件，所以日志查询每次都是真实抓取。
      HDW_LOG_FETCHING_DATA_DIR: /data/mapping/Log_Fetching/data
      HDW_SIS_BASE_URL: ${HDW_SIS_BASE_URL:-}
      HDW_SIS_LOGIN_URL: ${HDW_SIS_LOGIN_URL:-}
      HDW_SIS_USERNAME: ${HDW_SIS_USERNAME:-}
      HDW_SIS_PASSWORD: ${HDW_SIS_PASSWORD:-}
      HDW_SIS_LANGUAGE: ${HDW_SIS_LANGUAGE:-zh-Hans}
      HDW_RTSP_STREAMS_JSON: ${HDW_RTSP_STREAMS_JSON:-}
    volumes:
      - ../HDW_DataFoundation/Mapping:/data/mapping
    ports:
      - "127.0.0.1:${HDW_MCP_PORT:-8766}:8766"

  hdw-webui:
    # 机器重启/Docker 重启后自动拉起。**远端 compose 一直有这条，本机漏了**——2026-09-26 内核升级重启后，本机 10 个容器一个都没回来。
    restart: unless-stopped
    image: nginx:1.27-alpine
    profiles: ["web"]
    volumes:
      - ../HDW_Frontend/industrial-webui/index.html:/usr/share/nginx/html/index.html:ro
      - ../HDW_Frontend/industrial-webui/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # 本地 JS 依赖。内网部署，**不能用 CDN**，所以 markdown 渲染器放本地。
      - ../HDW_Frontend/industrial-webui/lib:/usr/share/nginx/html/lib:ro
      - ../icons:/usr/share/nginx/html/icons:ro
      - ../HDW_Animation/aora-bot/emotion-ball/js:/usr/share/nginx/html/ball:ro
      - ../HDW_Frontend/FRP/certs:/etc/nginx/certs:ro
    ports:
      - "${HDW_WEBUI_BIND:-0.0.0.0}:${HDW_WEBUI_PORT:-3000}:8080"
      - "${HDW_WEBUI_BIND:-0.0.0.0}:${HDW_WEBUI_TLS_PORT:-8443}:8443"
    depends_on:
      - hdw-qa-api
      - hdw-ingest
